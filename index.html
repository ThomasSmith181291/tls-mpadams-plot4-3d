<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="logo.png">
<title>TLS Project Environment</title>
<style>
  :root {
    --blue:#17458c; --blue-d:#0f3268; --gold:#d6a935; --ink:#15171b; --muted:#5d6472; --line:#dde2ea;
    --bg:#f1f3f6; --card:#fff; --chip:#e4e9f2; --red:#c62f2f;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI",-apple-system,Roboto,Helvetica,Arial,sans-serif; }
  body { display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
  a { color:var(--blue); }
  button { font:inherit; }

  /* ---- top bar */
  #top { background:var(--blue); color:#fff; flex:0 0 auto; }
  #top .row { display:flex; align-items:center; gap:12px; padding:8px 14px; }
  #top .logo { background:#fff; border-radius:6px; padding:3px 6px; display:flex; }
  #top .logo img { height:28px; display:block; }
  #top .names { min-width:0; flex:1; }
  #top .env { font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.8; }
  #top .job { font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #top .status { font-size:11px; font-weight:700; letter-spacing:.06em; background:#fff; color:var(--blue);
    border-radius:4px; padding:3px 7px; white-space:nowrap; }
  #tabs { display:flex; gap:2px; padding:0 8px; overflow-x:auto; scrollbar-width:none; }
  #tabs::-webkit-scrollbar { display:none; }
  #tabs a { color:#dfe7f5; text-decoration:none; padding:8px 11px 9px; font-size:14px; white-space:nowrap;
    border-bottom:3px solid transparent; }
  #tabs a.on { color:#fff; border-bottom-color:var(--gold); font-weight:600; }

  main { flex:1; min-height:0; position:relative; }
  .page { position:absolute; inset:0; overflow:auto; }
  .page[hidden] { display:none !important; }
  .wrap { max-width:1180px; margin:0 auto; padding:18px 16px 40px; }
  h2 { font-size:18px; margin:22px 0 4px; }
  h2:first-child { margin-top:4px; }
  .note { color:var(--muted); font-size:13px; margin:0 0 12px; }

  /* ---- home */
  .hero { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px;
    display:flex; flex-wrap:wrap; gap:14px 28px; align-items:flex-end; }
  .hero h1 { font-size:22px; margin:0; }
  .hero .facts { display:flex; flex-wrap:wrap; gap:6px 22px; font-size:13px; color:var(--muted); }
  .hero .facts b { color:var(--ink); font-weight:600; }
  .model-card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .model-card .grp { font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase;
    letter-spacing:.06em; margin:10px 0 6px; }
  .model-card .grp:first-child { margin-top:0; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:6px; background:var(--chip); color:var(--blue);
    text-decoration:none; border:0; border-radius:6px; padding:8px 11px; font-size:14px; cursor:pointer; }
  .chip .n { background:var(--blue); color:#fff; border-radius:4px; font-size:12px; font-weight:700;
    padding:1px 6px; }
  .chip:hover { background:#d5deec; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; }
  .doc { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden;
    text-decoration:none; color:var(--ink); display:flex; flex-direction:column; }
  .doc:hover { border-color:#b9c6da; box-shadow:0 2px 10px rgba(20,40,80,.08); }
  .doc img { width:100%; aspect-ratio:1.414; object-fit:cover; object-position:top left; background:#fff;
    border-bottom:1px solid var(--line); display:block; }
  .doc .t { padding:8px 10px 10px; }
  .doc .num { font-size:12px; font-weight:700; color:var(--blue); }
  .doc .ttl { font-size:14px; line-height:1.25; margin-top:2px; }
  .doc .meta { font-size:12px; color:var(--muted); margin-top:3px; }
  .dl { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 0; }
  .dl a { font-size:14px; background:var(--card); border:1px solid var(--line); border-radius:6px;
    padding:8px 11px; text-decoration:none; }
  .dl a.big { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600; }
  .hero .dl { margin:0; margin-left:auto; }
  .ghead { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 14px; margin:22px 0 4px; }
  .ghead h2 { margin:0; }
  .ghead a { font-size:13px; text-decoration:none; }
  .panels { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:0 0 12px; }
  .panels .set { display:flex; flex-wrap:wrap; align-items:center; gap:5px; padding:5px 0; }
  .panels .set + .set { border-top:1px solid var(--line); }
  .panels .lab { font-size:12px; font-weight:700; color:var(--muted); min-width:128px; }
  .panels a { font-size:13px; text-decoration:none; background:var(--chip); border-radius:5px; padding:4px 7px; }
  .panels a:hover { background:#d5deec; }
  #panelsel { max-width:130px; }

  /* ---- document viewer */
  #docv { display:flex; flex-direction:column; overflow:hidden; }
  #docbar { flex:0 0 auto; display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:7px 10px;
    background:var(--card); border-bottom:1px solid var(--line); }
  #docbar .title { min-width:0; flex:1 1 180px; }
  #docbar .title .num { font-size:12px; font-weight:700; color:var(--blue); }
  #docbar .title .ttl { font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tb { border:1px solid #c9d1de; background:#fff; color:var(--ink); border-radius:6px; padding:6px 10px;
    font-size:14px; cursor:pointer; text-decoration:none; white-space:nowrap; }
  .tb:disabled { opacity:.4; cursor:default; }
  .tb.primary { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600; }
  .tbgroup { display:flex; align-items:center; gap:4px; }
  #pageno { font-size:13px; color:var(--muted); min-width:64px; text-align:center; }
  #pdfwrap { flex:1; min-height:0; overflow:auto; background:#5b6069; touch-action:pan-x pan-y;
    cursor:grab; position:relative; }
  #pdfwrap.drag { cursor:grabbing; }
  #pdfpad { padding:12px; display:inline-block; min-width:100%; text-align:center; }
  #pdfcanvas { background:#fff; box-shadow:0 2px 14px rgba(0,0,0,.35); transform-origin:0 0; display:inline-block; }
  #docmsg { position:absolute; left:50%; top:40%; transform:translate(-50%,-50%); color:#fff; font-size:14px; }

  /* ---- 3D */
  #v3d { display:flex; flex-direction:column; overflow:hidden; background:#f4f5f7; }
  #v3dhead { flex:0 0 auto; padding:8px 14px; background:var(--card); border-bottom:1px solid var(--line); }
  #v3dhead h3 { margin:0; font-size:16px; }
  #v3dhead p { margin:2px 0 0; font-size:13px; color:var(--muted); }
  #stage3d { position:relative; flex:1; min-height:0; }
  #c3d { display:block; width:100%; height:100%; touch-action:none; }
  #tools { position:absolute; top:10px; right:10px; display:flex; flex-direction:column; gap:6px; align-items:stretch; }
  #tools .tb[aria-pressed="true"] { background:var(--blue); border-color:var(--blue); color:#fff; }
  #tools .part { font-weight:700; font-size:14px; padding:9px 12px; border:2px solid var(--blue); color:var(--blue); }
  #tools .part[aria-pressed="true"] { color:#fff; }
  #load3d { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:rgba(255,255,255,.96);
    padding:12px 16px; border-radius:8px; font-size:14px; box-shadow:0 2px 12px rgba(0,0,0,.12); }
  #cut { position:absolute; left:10px; right:10px; bottom:10px; max-width:520px; margin:0 auto;
    background:rgba(255,255,255,.95); border:1px solid var(--line); border-radius:8px; padding:8px 12px;
    display:flex; align-items:center; gap:10px; font-size:13px; }
  #cut input { flex:1; }
  #hint3d { position:absolute; left:10px; top:10px; font-size:11px; color:var(--muted); max-width:46%; }
  #views { flex:0 0 auto; display:flex; gap:6px; padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    overflow-x:auto; background:var(--card); border-top:1px solid var(--line); }
  #views .sep { flex:0 0 1px; background:var(--line); margin:2px 4px; }
  #views button { flex:0 0 auto; border:0; border-radius:6px; padding:8px 11px; font-size:13px;
    background:var(--chip); color:var(--blue); cursor:pointer; white-space:nowrap; }
  #views button.done { background:#cfd8e8; }
  #views button.on { background:var(--blue); color:#fff; }
  @media (max-width:560px) {
    #top .env { display:none; } #top .job { font-size:14px; } #top .logo img { height:22px; }
    .hero h1 { font-size:18px; } #hint3d { display:none; }
    .grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header id="top">
  <div class="row">
    <a class="logo" href="#/"><img src="logo.png" alt="TLS"></a>
    <div class="names"><div class="env">TLS Project Environment</div><div class="job" id="jobname"></div></div>
    <div class="status" id="status"></div>
  </div>
  <nav id="tabs"></nav>
</header>
<main>
  <section class="page" id="home" hidden><div class="wrap" id="homewrap"></div></section>
  <section class="page" id="group" hidden><div class="wrap" id="groupwrap"></div></section>
  <section class="page" id="docv" hidden>
    <div id="docbar">
      <a class="tb" id="docback" href="#/">&larr;</a>
      <div class="title"><div class="num" id="docnum"></div><div class="ttl" id="docttl"></div></div>
      <div class="tbgroup">
        <button class="tb" id="prev" aria-label="Previous page">&#8249;</button>
        <span id="pageno"></span>
        <button class="tb" id="next" aria-label="Next page">&#8250;</button>
      </div>
      <div class="tbgroup">
        <button class="tb" id="zout" aria-label="Zoom out">&minus;</button>
        <button class="tb" id="zfit">Fit</button>
        <button class="tb" id="zin" aria-label="Zoom in">+</button>
      </div>
      <select class="tb" id="panelsel" hidden aria-label="Go to panel"></select>
      <a class="tb primary" id="open3d" hidden>Open in 3D</a>
      <a class="tb" id="download" download>Download</a>
    </div>
    <div id="pdfwrap"><div id="pdfpad"><canvas id="pdfcanvas"></canvas></div><div id="docmsg"></div></div>
  </section>
  <section class="page" id="v3d" hidden>
    <div id="v3dhead"><h3 id="v3dtitle"></h3><p id="v3ddesc"></p></div>
    <div id="stage3d">
      <canvas id="c3d"></canvas>
      <div id="hint3d">Drag to rotate &middot; pinch or scroll to zoom &middot; two fingers or right-drag to pan</div>
      <div id="tools"></div>
      <div id="cut" hidden><span>Cut</span><input type="range" id="cutpos" min="0" max="10000" value="5000"><span id="cutval"></span></div>
      <div id="load3d" hidden>Loading 3D model&hellip;</div>
    </div>
    <div id="views"></div>
  </section>
</main>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const P = await (await fetch("portal.json", { cache: "no-cache" })).json();
const proj = P.project;
$("jobname").textContent = proj.job;
$("status").textContent = `${proj.status || ""} · ${proj.revision || ""}`;
document.title = `${proj.job} · TLS Project Environment`;
const groupsById = Object.fromEntries(P.groups.map(g => [g.id, g]));
const viewsById = Object.fromEntries(P.views.map(v => [v.id, v]));
const mb = b => `${(b / 1e6).toFixed(b < 1e5 ? 2 : 1)} MB`;

// ------------------------------------------------------------------ tabs + router
const TABS = [["", "Home"], ["3d/stage-" + P.stages.length, "3D model"],
  ...P.groups.filter(g => g.docs.length || (g.downloads || []).length).map(g => ["docs/" + g.id, g.title])];
$("tabs").innerHTML = TABS.map(([h, t]) => `<a href="#/${h}" data-h="${h}">${esc(t)}</a>`).join("");

function showPage(id) {
  for (const p of document.querySelectorAll(".page")) p.hidden = p.id !== id;
  running3d = id === "v3d";
  if (running3d) resize3d();
}

function route() {
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const [path, query] = raw.split("?");
  const parts = path.split("/").filter(Boolean);
  const q = Object.fromEntries(new URLSearchParams(query || ""));
  let tab = "";
  if (parts[0] === "3d") { tab = TABS[1][0]; open3d(parts[1] || `stage-${P.stages.length}`, q); }
  else if (parts[0] === "docs" && groupsById[parts[1]]) { tab = "docs/" + parts[1]; renderGroup(parts[1]); }
  else if (parts[0] === "doc" && groupsById[parts[1]]) { tab = "docs/" + parts[1]; openDoc(parts[1], parts[2], +(q.page || 1)); }
  else renderHome();
  for (const a of $("tabs").children) a.classList.toggle("on", a.dataset.h === tab);
  $("tabs").querySelector(".on")?.scrollIntoView({ inline: "nearest", block: "nearest" });
}
addEventListener("hashchange", route);

// ------------------------------------------------------------------ home + groups
function docCard(g, d) {
  const meta = [d.subtitle, `${d.pages} page${d.pages === 1 ? "" : "s"}`].filter(Boolean).join(" · ");
  return `<a class="doc" href="#/doc/${g.id}/${encodeURIComponent(d.id)}">
    <img loading="lazy" src="${esc(d.thumb)}" alt="">
    <div class="t">${d.number ? `<div class="num">${esc(d.number)}</div>` : ""}
    <div class="ttl">${esc(d.title)}</div><div class="meta">${esc(meta)}</div></div></a>`;
}
function downloads(g) {
  return (g.downloads || []).length ? `<div class="dl">${g.downloads.map(x =>
    `<a href="${esc(x.file)}" download>&#8681; ${esc(x.title)}</a>`).join("")}</div>` : "";
}
function panelIndex(g) {
  const sets = g.docs.filter(d => (d.panels || []).length);
  if (!sets.length) return "";
  return `<div class="panels">${sets.map(d => `<div class="set"><span class="lab">${esc(d.title)}</span>${
    d.panels.map(x => `<a href="#/doc/${g.id}/${encodeURIComponent(d.id)}?page=${x.page}">${esc(x.name)}</a>`).join("")}</div>`).join("")}</div>`;
}
function groupHead(g, first) {
  const zip = g.zip ? `<a href="${esc(g.zip.file)}" download>&#8681; Download all (ZIP, ${g.zip.count} files, ${mb(g.zip.bytes)})</a>` : "";
  return `<div class="ghead"${first ? ' style="margin-top:4px"' : ""}><h2>${esc(g.title)}</h2>${zip}</div>
    ${g.note ? `<p class="note">${esc(g.note)}</p>` : ""}`;
}
function modelCard() {
  const chip = v => `<a class="chip" href="#/3d/${v.id}">${v.kind === "stage" ? `<span class="n">${v.n}</span>` : ""}${esc(v.title)}</a>`;
  const by = k => P.views.filter(v => v.kind === k).map(chip).join("");
  return `<div class="model-card">
    <div class="grp">Build sequence</div><div class="chips">${by("stage")}</div>
    <div class="grp">Sections</div><div class="chips">${by("section")}</div>
    <div class="grp">Elevations</div><div class="chips">${by("elevation")}</div></div>`;
}
function renderHome() {
  showPage("home");
  const facts = [["Client", proj.client], ["Status", proj.status], ["Revision", proj.revision]];
  const all = P.download_all;
  let h = `<div class="hero"><div><div class="note" style="margin:0">TLS Timber Frame · Design &amp; Manufacture</div>
    <h1>${esc(proj.job)}</h1></div><div class="facts">${facts.map(([k, v]) => `<span>${k} <b>${esc(v)}</b></span>`).join("")}</div>
    ${all ? `<div class="dl"><a class="big" href="${esc(all.file)}" download>&#8681; Download everything (ZIP, ${all.count} files, ${mb(all.bytes)})</a></div>` : ""}</div>
    <h2>3D model</h2><p class="note">SketchUp model, stage by stage as it is built. Sections cut through the full frame.</p>${modelCard()}`;
  for (const g of P.groups) {
    if (!g.docs.length && !(g.downloads || []).length) continue;
    h += `${groupHead(g)}${panelIndex(g)}<div class="grid">${g.docs.map(d => docCard(g, d)).join("")}</div>${downloads(g)}`;
  }
  $("homewrap").innerHTML = h;
}
function renderGroup(id) {
  showPage("group");
  const g = groupsById[id];
  $("groupwrap").innerHTML = `${groupHead(g, true)}${panelIndex(g)}
    <div class="grid">${g.docs.map(d => docCard(g, d)).join("")}</div>${downloads(g)}`;
  $("group").scrollTop = 0;
}

// ------------------------------------------------------------------ PDF viewer
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const pdfCache = new Map();
const doc = { g: null, d: null, pdf: null, page: 1, zoom: 1, fit: 1, task: null, pageObj: null };
const MAX_PIXELS = 16e6;

async function openDoc(gid, did, page) {
  showPage("docv");
  const g = groupsById[gid], d = g.docs.find(x => x.id === did) || g.docs[0];
  if (!d) { $("docmsg").textContent = "Document not found."; return; }
  $("docback").href = `#/docs/${gid}`;
  $("docnum").textContent = d.number || g.title;
  $("docttl").textContent = d.title;
  $("download").href = d.file;
  const v = d.view && viewsById[d.view];
  $("open3d").hidden = !v;
  if (v) {
    const qs = new URLSearchParams(Object.entries(d.view_opts || {}).map(([k, x]) => [k, x ? 1 : 0])).toString();
    $("open3d").href = `#/3d/${v.id}${qs ? "?" + qs : ""}`;
  }
  const same = doc.d === d;
  doc.g = g; doc.d = d;
  if (!same) {
    $("docmsg").textContent = "Loading…";
    $("pdfcanvas").style.visibility = "hidden";
    if (!pdfCache.has(d.file)) pdfCache.set(d.file, pdfjsLib.getDocument(d.file).promise);
    try { doc.pdf = await pdfCache.get(d.file); }
    catch (e) { $("docmsg").textContent = "Could not load this PDF. Check the connection and try again."; return; }
    if (doc.d !== d) return;
    doc.zoom = 1;
  }
  doc.page = Math.min(Math.max(1, page || 1), doc.pdf.numPages);
  const sel = $("panelsel");
  sel.hidden = !(d.panels || []).length;
  if (!sel.hidden) {
    sel.innerHTML = d.panels.map(x => `<option value="${x.page}"${x.page === doc.page ? " selected" : ""}>${esc(x.name)}</option>`).join("");
    sel.onchange = () => goPage(+sel.value);
  }
  await renderPdfPage();
}

async function renderPdfPage(focus) {
  const { pdf } = doc;
  const p = await pdf.getPage(doc.page);
  const wrap = $("pdfwrap"), cv = $("pdfcanvas");
  const base = p.getViewport({ scale: 1 });
  doc.fit = Math.min((wrap.clientWidth - 24) / base.width, (wrap.clientHeight - 24) / base.height);
  const dpr = Math.min(devicePixelRatio || 1, 3);
  let css = doc.fit * doc.zoom;
  let px = css * dpr;
  if (base.width * base.height * px * px > MAX_PIXELS) px = Math.sqrt(MAX_PIXELS / (base.width * base.height));
  const vp = p.getViewport({ scale: px });
  if (doc.task) doc.task.cancel();
  const off = document.createElement("canvas");
  off.width = Math.floor(vp.width); off.height = Math.floor(vp.height);
  doc.task = p.render({ canvasContext: off.getContext("2d"), viewport: vp });
  try { await doc.task.promise; } catch (e) { return; }
  cv.width = off.width; cv.height = off.height;
  cv.getContext("2d").drawImage(off, 0, 0);
  cv.style.width = `${base.width * css}px`; cv.style.height = `${base.height * css}px`;
  cv.style.transform = ""; cv.style.visibility = "visible";
  $("docmsg").textContent = "";
  $("pageno").textContent = `${doc.page} / ${pdf.numPages}`;
  $("prev").disabled = doc.page <= 1; $("next").disabled = doc.page >= pdf.numPages;
  if (focus) { wrap.scrollLeft = focus.x * css - focus.cx; wrap.scrollTop = focus.y * css - focus.cy; }
}

function setZoom(z, cx, cy) {
  const wrap = $("pdfwrap"), cv = $("pdfcanvas");
  z = Math.min(Math.max(z, 1), 8);
  const css = doc.fit * doc.zoom, r = cv.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
  if (cx === undefined) { cx = wr.width / 2; cy = wr.height / 2; }
  const focus = { x: (wr.left + cx - r.left) / css, y: (wr.top + cy - r.top) / css, cx: cx - 12, cy: cy - 12 };
  doc.zoom = z;
  renderPdfPage(focus);
}
const goPage = n => { location.hash = `#/doc/${doc.g.id}/${encodeURIComponent(doc.d.id)}?page=${n}`; };
$("prev").onclick = () => goPage(doc.page - 1);
$("next").onclick = () => goPage(doc.page + 1);
$("zin").onclick = () => setZoom(doc.zoom * 1.6);
$("zout").onclick = () => setZoom(doc.zoom / 1.6);
$("zfit").onclick = () => { doc.zoom = 1; renderPdfPage(); };
addEventListener("keydown", e => {
  if ($("docv").hidden) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") { if (doc.page < doc.pdf.numPages) goPage(doc.page + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { if (doc.page > 1) goPage(doc.page - 1); }
});
{ // pinch / wheel zoom, drag to pan, double-tap
  const wrap = $("pdfwrap"), cv = $("pdfcanvas");
  const pts = new Map(); let pinch = null, drag = null, lastTap = 0;
  wrap.addEventListener("wheel", e => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    const wr = wrap.getBoundingClientRect();
    setZoom(doc.zoom * (e.deltaY < 0 ? 1.25 : 0.8), e.clientX - wr.left, e.clientY - wr.top);
  }, { passive: false });
  wrap.addEventListener("pointerdown", e => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      const wr = wrap.getBoundingClientRect(), r = cv.getBoundingClientRect();
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), cx: (a.x + b.x) / 2 - wr.left, cy: (a.y + b.y) / 2 - wr.top,
        ox: (a.x + b.x) / 2 - r.left, oy: (a.y + b.y) / 2 - r.top, s: 1 };
      drag = null;
    } else if (e.pointerType === "mouse") {
      drag = { x: e.clientX, y: e.clientY, l: wrap.scrollLeft, t: wrap.scrollTop }; wrap.classList.add("drag");
    }
    if (e.pointerType !== "mouse") {
      const now = Date.now();
      if (pts.size === 1 && now - lastTap < 300) {
        const wr = wrap.getBoundingClientRect();
        setZoom(doc.zoom > 1.2 ? 1 : 3, e.clientX - wr.left, e.clientY - wr.top);
      }
      lastTap = now;
    }
  });
  wrap.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pts.size === 2) {
      e.preventDefault();
      const [a, b] = [...pts.values()];
      pinch.s = Math.hypot(a.x - b.x, a.y - b.y) / pinch.d;
      cv.style.transformOrigin = `${pinch.ox}px ${pinch.oy}px`;
      cv.style.transform = `scale(${pinch.s})`;
    } else if (drag) {
      wrap.scrollLeft = drag.l - (e.clientX - drag.x); wrap.scrollTop = drag.t - (e.clientY - drag.y);
    }
  });
  const end = e => {
    pts.delete(e.pointerId);
    if (pinch && pts.size < 2) { const p = pinch; pinch = null; setZoom(doc.zoom * p.s, p.cx, p.cy); }
    if (drag && e.pointerType === "mouse") { drag = null; wrap.classList.remove("drag"); }
  };
  wrap.addEventListener("pointerup", end); wrap.addEventListener("pointercancel", end);
  wrap.style.touchAction = "pan-x pan-y";
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (!$("docv").hidden && doc.pdf) renderPdfPage(); }, 200); });
}

// ------------------------------------------------------------------ 3D viewer
const canvas = $("c3d");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4f5f7);
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 2000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.12;
// SketchUp-like diffuse shading (lights scale LINEAR colour): walls ~1.0x, faces pointing up ~1.5x.
scene.add(new THREE.HemisphereLight(0xffffff, 0x8c9099, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.85); sun.position.set(-0.5, 0.75, 0.45); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.3); fill.position.set(0.6, 0.2, -0.8); scene.add(fill);
const loader = new GLTFLoader().setDRACOLoader(
  new DRACOLoader().setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/"));

const loaded = new Map();                // glb -> { group, stage, part }
const partOn = {};
const PART_LABEL = {};
for (const s of P.stages) for (const f of s.files || []) if (f.part) PART_LABEL[f.part] = f.label || f.part;
const cutPlane = new THREE.Plane(new THREE.Vector3(1, 0, 0), 0);
const sectionUniform = { value: 0 };
let view = null, fade = false, edges = true, running3d = false, framedFor = null, cutRange = [0, 1];

function prepare(root) {
  root.traverse(o => {
    if (o.isLineSegments || o.isLine) {
      o.material = new THREE.LineBasicMaterial({ color: 0x1b1c1f, transparent: true, opacity: 0.7 });
      o.userData.edge = true; o.renderOrder = 2;
    } else if (o.isMesh) {
      const mats = (Array.isArray(o.material) ? o.material : [o.material]).map(m => {
        const mm = new THREE.MeshLambertMaterial({ color: m.color, map: m.map, name: m.name,
          vertexColors: m.vertexColors, opacity: m.opacity, transparent: m.opacity < 1, side: THREE.DoubleSide });
        mm.polygonOffset = true; mm.polygonOffsetFactor = 1; mm.polygonOffsetUnits = 1;
        if (mm.transparent) mm.depthWrite = false;
        mm.userData.base = { opacity: mm.opacity, transparent: mm.transparent };
        // in a section view the inside of a cut member reads darker, like a cut face
        mm.onBeforeCompile = sh => {
          sh.uniforms.uSection = sectionUniform;
          sh.fragmentShader = "uniform float uSection;\n" + sh.fragmentShader.replace("#include <dithering_fragment>",
            "#include <dithering_fragment>\n if (uSection > 0.5 && !gl_FrontFacing) gl_FragColor.rgb *= 0.55;");
        };
        return mm;
      });
      o.material = mats.length === 1 ? mats[0] : mats;
    }
  });
}

function styleGroup(r) {
  const faded = fade && view.kind === "stage" && r.stage < view.n;
  r.group.traverse(o => {
    if (o.userData.edge) { o.visible = edges; o.material.opacity = faded ? 0.12 : 0.7; return; }
    if (!o.isMesh) return;
    for (const m of (Array.isArray(o.material) ? o.material : [o.material])) {
      const b = m.userData.base;
      if (faded) { m.transparent = true; m.opacity = 0.18 * b.opacity; m.depthWrite = false; }
      else { m.transparent = b.transparent; m.opacity = b.opacity; m.depthWrite = !b.transparent; }
      m.needsUpdate = true;
    }
  });
}

function loadFile(n, f) {
  if (loaded.has(f.glb)) return Promise.resolve(loaded.get(f.glb));
  return new Promise((res, rej) => loader.load(f.glb, g => {
    prepare(g.scene); scene.add(g.scene);
    const r = { group: g.scene, stage: n, part: f.part || null }; loaded.set(f.glb, r); res(r);
  }, ev => { if (ev.total) $("load3d").textContent = `Loading stage ${n}… ${Math.round(100 * ev.loaded / ev.total)}%`; }, rej));
}

function applyVisibility() {
  for (const r of loaded.values()) {
    r.group.visible = r.stage <= view.n && (!r.part || partOn[r.part] !== false);
    styleGroup(r);
  }
}

function modelBox() {
  const box = new THREE.Box3();
  for (const r of loaded.values()) if (r.stage <= view.n) box.expandByObject(r.group);
  return box;
}

function frame() {
  const box = modelBox();
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3()), rad = box.getSize(new THREE.Vector3()).length() / 2;
  const vf = THREE.MathUtils.degToRad(camera.fov / 2), hf = Math.atan(Math.tan(vf) * camera.aspect);
  let d = rad / Math.sin(Math.min(vf, hf)) * 0.95;
  let dir;
  if (view.kind === "section") {
    const n = cutPlane.normal;
    dir = n.clone().negate().add(new THREE.Vector3(-n.z * 0.35, 0.22, n.x * 0.35)).normalize();
    d *= 0.8;
  } else if (view.kind === "elevation") dir = new THREE.Vector3(...view.dir).normalize();
  else dir = new THREE.Vector3(-0.75, 0.55, 1.0).normalize();
  camera.position.copy(c).addScaledVector(dir, d);
  camera.near = Math.max(d / 500, 0.01); camera.far = d * 20; camera.updateProjectionMatrix();
  controls.target.copy(c); controls.update();
}

function setCut(t) {
  const n = cutPlane.normal, [a, b] = cutRange;
  const s = a + (b - a) * t;                                // signed distance along the look direction
  cutPlane.constant = -s;
  const base = new THREE.Vector3(...view.point).dot(n);
  const off = Math.round((s - base) * 100) * 10;          // nearest 10 mm
  $("cutval").textContent = off === 0 ? "at section line" : `${off > 0 ? "+" : ""}${off} mm`;
}

function tools() {
  const t = $("tools"); t.innerHTML = "";
  const add = (label, pressed, onclick, cls = "") => {
    const b = document.createElement(label.startsWith("http") ? "a" : "button");
    b.className = `tb ${cls}`; b.textContent = label;
    if (pressed !== null) b.setAttribute("aria-pressed", pressed);
    b.onclick = onclick; t.appendChild(b); return b;
  };
  const parts = new Set();
  for (const s of P.stages.slice(0, view.n)) for (const f of s.files || []) if (f.part) parts.add(f.part);
  for (const p of parts) add(`${PART_LABEL[p]}: ${partOn[p] === false ? "OFF" : "ON"}`, partOn[p] !== false,
    () => { partOn[p] = partOn[p] === false; applyVisibility(); tools(); }, "part");
  if (view.kind === "stage" && view.n > 1) add("Fade earlier stages", fade, () => { fade = !fade; applyVisibility(); tools(); });
  add("Edges", edges, () => { edges = !edges; applyVisibility(); tools(); });
  add("Reset view", null, () => frame());
  const drawing = P.groups.flatMap(g => g.docs.map(d => [g, d])).find(([g, d]) => d.view === view.id);
  if (drawing) {
    const a = document.createElement("a");
    a.className = "tb"; a.textContent = `Drawing ${drawing[1].number}`;
    a.href = `#/doc/${drawing[0].id}/${encodeURIComponent(drawing[1].id)}`; t.appendChild(a);
  }
}

function viewsBar() {
  const kinds = ["stage", "section", "elevation"];
  let h = "";
  kinds.forEach((k, i) => {
    if (i) h += `<span class="sep"></span>`;
    for (const v of P.views.filter(x => x.kind === k)) {
      const cls = v.id === view.id ? "on" : (k === "stage" && view.kind === "stage" && v.n < view.n ? "done" : "");
      h += `<button class="${cls}" data-v="${v.id}">${k === "stage" ? v.n + ". " : ""}${esc(v.title)}</button>`;
    }
  });
  $("views").innerHTML = h;
  for (const b of $("views").children) if (b.dataset.v) b.onclick = () => { location.hash = `#/3d/${b.dataset.v}`; };
  $("views").querySelector(".on")?.scrollIntoView({ inline: "center", block: "nearest" });
}

async function open3d(id, q) {
  showPage("v3d");
  view = viewsById[id] || viewsById[`stage-${P.stages.length}`];
  for (const [k, v] of Object.entries(q || {})) if (k in PART_LABEL) partOn[k] = v !== "0";
  $("v3dtitle").textContent = view.kind === "stage" ? `Stage ${view.n} of ${P.stages.length}: ${view.title}` : view.title;
  $("v3ddesc").textContent = view.desc;
  viewsBar(); tools();
  $("load3d").hidden = false;
  try {
    for (let k = 1; k <= view.n; k++) for (const f of P.stages[k - 1].files || [{ glb: P.stages[k - 1].glb }]) await loadFile(k, f);
  } catch (e) { $("load3d").textContent = "Could not load the 3D model. Check the connection and reload."; return; }
  if (!viewsById[id] && id !== view.id) return;
  $("load3d").hidden = true;
  const section = view.kind === "section";
  renderer.clippingPlanes = section ? [cutPlane] : [];
  sectionUniform.value = section ? 1 : 0;
  $("cut").hidden = !section;
  applyVisibility();
  if (section) {
    cutPlane.normal.set(...view.normal).normalize();
    const box = modelBox(), n = cutPlane.normal;
    const corners = [0, 1].flatMap(i => [0, 1].flatMap(j => [0, 1].map(k => new THREE.Vector3(
      [box.min.x, box.max.x][i], [box.min.y, box.max.y][j], [box.min.z, box.max.z][k]).dot(n))));
    cutRange = [Math.min(...corners), Math.max(...corners)];
    const base = new THREE.Vector3(...view.point).dot(n);
    $("cutpos").value = Math.round(10000 * (base - cutRange[0]) / (cutRange[1] - cutRange[0]));
    setCut((base - cutRange[0]) / (cutRange[1] - cutRange[0]));
  }
  const key = view.kind === "stage" ? "stage" : view.id;
  if (framedFor !== key) { resize3d(); frame(); framedFor = key; }
}
$("cutpos").oninput = e => setCut(+e.target.value / 10000);

function resize3d() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize3d).observe(canvas);
renderer.setAnimationLoop(() => { if (running3d) { controls.update(); renderer.render(scene, camera); } });

window.__portal = { P, scene, camera, controls, loaded, doc, route };
route();
</script>
</body>
</html>
